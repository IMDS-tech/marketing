<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <title>IMDS Marketing</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #172554 0, #0b1020 45%, #060912 100%); color: #f8fafc; }
    main { width: min(760px, calc(100% - 32px)); padding: 48px; border: 1px solid rgba(148,163,184,.18); border-radius: 24px; background: rgba(15,23,42,.78); backdrop-filter: blur(18px); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
    .eyebrow { color: #60a5fa; font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 14px 0 12px; font-size: clamp(34px, 7vw, 64px); line-height: 1; }
    p { margin: 0; max-width: 620px; color: #cbd5e1; font-size: 18px; line-height: 1.65; }
    .status { display: inline-flex; align-items: center; gap: 9px; margin-top: 28px; padding: 10px 14px; border-radius: 999px; background: rgba(34,197,94,.1); color: #86efac; font-size: 14px; font-weight: 700; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 16px #22c55e; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Integrated Meta Digital Systems</div>
    <h1>Marketing Platform</h1>
    <p>Единое рабочее пространство для аналитики Meta Ads, TikTok Ads, рекламных кабинетов, кампаний и CRM-конверсий.</p>
    <div class="status"><span class="dot"></span> Cloudflare deployment configured</div>
  </main>
</body>
</html>
