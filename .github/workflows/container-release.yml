name: Publish service containers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/container-release.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: container-release-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: platform-core-service, dockerfile: services/platform-core-service/Dockerfile}
          - {component: clients-api, dockerfile: services/clients-api/Dockerfile}
          - {component: integration-service, dockerfile: services/integration-service/Dockerfile}
          - {component: report-api, dockerfile: services/report-api/Dockerfile}
          - {component: ai-service, dockerfile: services/ai-service/Dockerfile}
          - {component: search-indexer, dockerfile: services/search-indexer/Dockerfile}
          - {component: notification-worker, dockerfile: services/notification-worker/Dockerfile}
          - {component: sync-worker, dockerfile: services/sync-worker/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/imds-marketing-${{ matrix.component }}
          tags: |
            type=sha
            type=raw,value=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
