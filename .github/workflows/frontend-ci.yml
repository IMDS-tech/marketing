name: Frontend and Integration CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'release/**'
  pull_request:
    paths:
      - 'apps/marketing-web/**'
      - 'packages/**'
      - 'services/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Typecheck workspaces
        run: pnpm check
      - name: Run tests
        run: pnpm test
      - name: Build production applications
        run: pnpm build
