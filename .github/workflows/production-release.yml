name: One-time production release 1a8fc65

on:
  push:
    branches:
      - agent/manual-production-release-20260806

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1a8fc65a7eb43ad7aab578961f02512aac78679f
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm validate
      - name: Link production Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm dlx supabase@2.109.1 link --project-ref '${{ secrets.SUPABASE_PROJECT_REF }}' --password "$SUPABASE_DB_PASSWORD"
      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm dlx supabase@2.109.1 db push --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PLATFORM_CORE_SERVICE_URL: ${{ vars.VITE_PLATFORM_CORE_SERVICE_URL }}
          VITE_CLIENTS_API_URL: ${{ vars.VITE_CLIENTS_API_URL }}
          VITE_INTEGRATION_SERVICE_URL: ${{ vars.VITE_INTEGRATION_SERVICE_URL }}
          VITE_REPORT_API_URL: ${{ vars.VITE_REPORT_API_URL }}
          VITE_AI_SERVICE_URL: ${{ vars.VITE_AI_SERVICE_URL }}
          VITE_SEARCH_INDEXER_URL: ${{ vars.VITE_SEARCH_INDEXER_URL }}
          VITE_ENABLE_DEMO_FALLBACK: 'false'
        run: pnpm deploy
      - name: Production smoke
        env:
          WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
          PLATFORM_CORE_URL: ${{ vars.VITE_PLATFORM_CORE_SERVICE_URL }}/health
          CLIENTS_API_URL: ${{ vars.VITE_CLIENTS_API_URL }}/health
          INTEGRATION_SERVICE_URL: ${{ vars.VITE_INTEGRATION_SERVICE_URL }}/health
          REPORT_API_URL: ${{ vars.VITE_REPORT_API_URL }}/health
          AI_SERVICE_URL: ${{ vars.VITE_AI_SERVICE_URL }}/health
          SEARCH_INDEXER_URL: ${{ vars.VITE_SEARCH_INDEXER_URL }}/health
        run: pnpm healthcheck:all
