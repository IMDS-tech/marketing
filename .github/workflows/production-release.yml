name: Production runtime diagnosis

on:
  push:
    branches:
      - agent/manual-production-release-20260806

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public dashboard route
        run: |
          set -euo pipefail
          url='https://marketing.hudaikulovimomali.workers.dev/client/d4037546-535d-43e5-9ac6-2b0b0a687c18/dashboards'
          code="$(curl --retry 3 --retry-delay 2 -sS -L -o page.html -w '%{http_code}' "$url")"
          echo "dashboard_http=$code"
          test "$code" = '200'
          test -s page.html
          grep -o '<script[^>]*src="[^"]*"' page.html || true
      - name: Inspect deployed frontend assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import urljoin

          base = 'https://marketing.hudaikulovimomali.workers.dev/'
          html = Path('page.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html)
          if not scripts:
              raise SystemExit('No JavaScript assets found in production HTML')
          combined = ''
          for index, src in enumerate(scripts):
              url = urljoin(base, src)
              target = Path(f'asset-{index}.js')
              subprocess.run(['curl', '--retry', '3', '--retry-delay', '2', '-sS', '-L', '-o', str(target), url], check=True)
              text = target.read_text(encoding='utf-8', errors='replace')
              print(f'asset={url} bytes={len(text)}')
              combined += text
          markers = {
              'clients_fallback': '/functions/v1/clients-api',
              'dashboard_fallback': '/functions/v1/dashboard-api',
              'supabase_project': 'ctqgdbhgxwfhggjbgzxm',
          }
          missing = []
          for name, marker in markers.items():
              present = marker in combined
              print(f'{name}={present}')
              if not present:
                  missing.append(name)
          if missing:
              raise SystemExit('Production frontend is stale or misconfigured: ' + ', '.join(missing))
          PY
      - name: Verify protected Edge Function gateways
        run: |
          set -euo pipefail
          for fn in clients-api dashboard-api; do
            code="$(curl -sS -o "$fn.json" -w '%{http_code}' "https://ctqgdbhgxwfhggjbgzxm.supabase.co/functions/v1/$fn/health")"
            echo "$fn unauthenticated_http=$code"
            test "$code" = '401'
          done
